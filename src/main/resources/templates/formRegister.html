<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Registrazione</title>
	<link rel="stylesheet" th:href="@{/css/stile.css}">
</head>
<body>
	<header th:replace="~{fragments/base :: intestazione}"></header>

	<main class="contenuto">
		<h1>Registrazione</h1>

		<p th:if="${erroreRegistrazione}" th:text="${erroreRegistrazione}" class="errore"></p>

		<form th:action="@{/register}" method="post">
			<p>
				<label>Nome:</label>
				<input type="text" th:field="${user.name}" />
				<span th:errors="${user.name}" class="errore"></span>
			</p>
			<p>
				<label>Cognome:</label>
				<input type="text" th:field="${user.surname}" />
				<span th:errors="${user.surname}" class="errore"></span>
			</p>
			<p>
				<label>Email:</label>
				<input type="text" th:field="${user.email}" />
				<span th:errors="${user.email}" class="errore"></span>
			</p>
			<p>
				<label>Username:</label>
				<input type="text" th:field="${credentials.username}" />
				<span th:errors="${credentials.username}" class="errore"></span>
			</p>
			<p>
				<label>Password:</label>
				<input type="password" th:field="${credentials.password}" />
				<span th:errors="${credentials.password}" class="errore"></span>
			</p>
			<p>
				<button type="submit">Registrati</button>
			</p>
		</form>

		<p>Hai già un account? <a th:href="@{/login}">Accedi</a></p>
	</main>
</body>
</html>
