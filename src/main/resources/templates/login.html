<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Accedi</title>
	<link rel="stylesheet" th:href="@{/css/stile.css}">
</head>
<body>
	<header th:replace="~{fragments/base :: intestazione}"></header>

	<main class="contenuto">
		<h1>Accedi</h1>

		<p th:if="${param.error}" class="errore">Username o password non corretti.</p>

		<form th:action="@{/login}" method="post">
			<p>
				<label>Username:</label>
				<input type="text" name="username" />
			</p>
			<p>
				<label>Password:</label>
				<input type="password" name="password" />
			</p>
			<p>
				<button type="submit">Accedi</button>
			</p>
		</form>

		<p>Non hai un account? <a th:href="@{/register}">Registrati</a></p>
	</main>
</body>
</html>
